name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Typecheck · tests · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.20.2"
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and integration tests
        run: npm test --silent
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://example.invalid
          REFERENCE_DATE: "2027-04-01"
      - name: Smoke (live server)
        run: |
          npm run seed
          npm run start &           for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3000/api/health && break; sleep 1; done
          npm run smoke

  service:
    name: Python service tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r backend/requirements.txt -r services/analytics/requirements.txt
      - name: pytest (backend)
        run: cd backend && python -m pytest -q
      - name: pytest (analytics service)
        run: cd services/analytics && python -m pytest -q
