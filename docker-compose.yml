# =============================================================================
# Local full-stack stack: Next.js web + FastAPI backend + worker + PostgreSQL.
#   docker compose up --build          # http://localhost:3000 and :8000/docs
#   docker compose --profile db up      # adds PostgreSQL on :5432
# The application runs fine WITHOUT the api/db services (phase 1 behaviour).
# =============================================================================
name: ucip

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL:-hello@cricket-intelligence.example}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    image: ucip-web:local
    container_name: ucip-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATA_DIR: /app/.data
      REFERENCE_DATE: ${REFERENCE_DATE:-2027-04-01}
      DEMO_MODE: ${DEMO_MODE:-true}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL:-hello@cricket-intelligence.example}
      # Same FastAPI service, two names: the browser-visible origin (NEXT_PUBLIC_API_URL,
      # used for display/diagnostics) and the server-side endpoint the BFF actually calls.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      ANALYTICS_SERVICE_URL: ${ANALYTICS_SERVICE_URL:-http://api:8000}
      ANALYTICS_SERVICE_TOKEN: ${ANALYTICS_SERVICE_TOKEN:-}
      BACKEND_TIMEOUT_MS: ${BACKEND_TIMEOUT_MS:-4000}
      # Server-only secrets are read from the host env file, never baked into the image.
      AI_API_KEY: ${AI_API_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      ENFORCE_HTTPS: ${ENFORCE_HTTPS:-false}
    volumes:
      - ucip-data:/app/.data
    depends_on:
      api:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ucip-api:local
    container_name: ucip-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      BACKEND_ENV: production
      BACKEND_PORT: 8000
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:3000}
      BACKEND_LOG_LEVEL: ${BACKEND_LOG_LEVEL:-info}
      ANALYTICS_SERVICE_TOKEN: ${ANALYTICS_SERVICE_TOKEN:-}
      DATABASE_URL: ${DATABASE_URL:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ucip-api:local
    container_name: ucip-worker
    restart: unless-stopped
    command: ["python", "-m", "background_workers.worker"]
    environment:
      BACKEND_ENV: production
      BACKEND_LOG_LEVEL: ${BACKEND_LOG_LEVEL:-info}
      DATABASE_URL: ${DATABASE_URL:-}
      WORKER_POLL_SECONDS: "15"
    depends_on:
      api:
        condition: service_healthy
        required: false
    security_opt:
      - no-new-privileges:true

  db:
    image: postgres:16-alpine
    container_name: ucip-db
    profiles: ["db"]           # start with: docker compose --profile db up
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ucip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
      POSTGRES_DB: ${POSTGRES_DB:-ucip}
    ports:
      - "5432:5432"
    volumes:
      - ucip-db:/var/lib/postgresql/data
      - ./database/schemas:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ucip} -d ${POSTGRES_DB:-ucip}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ucip-data:
  ucip-db:
